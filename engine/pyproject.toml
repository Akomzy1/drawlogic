[project]
name = "drawlogic-engine"
version = "0.0.0"
description = "Drawlogic engine: DDL, solver, rules, interpretation (engine/core, Claude Code) and render, geo, providers, 3d (Codex). FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "hypothesis==6.168.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
