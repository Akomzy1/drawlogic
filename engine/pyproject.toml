[project]
name = "drawlogic-engine"
version = "0.0.0"
description = "Drawlogic engine: DDL, solver, rules, interpretation (engine/core, Claude Code) and render, geo, providers, 3d (Codex). FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "rfc8785==0.1.4",
  "ezdxf==1.4.4",
  "pillow==12.3.0",
  "pycairo==1.29.1",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "hypothesis==6.168.2",
  "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["(^|/)tests/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
