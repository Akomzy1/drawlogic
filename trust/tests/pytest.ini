[pytest]
testpaths = .
# With -c from the repository root, pytest discovers from the invocation directory.
# Keep that documented CI command inside the trust examination suite.
norecursedirs = .* fixtures engine contracts site app profiles design docs skills
addopts = -ra -p no:cacheprovider
markers =
    fixtures: offline validation of examiner-owned data
    runtime: gates that require the real core or trust service
    profiles: Prompt 3 authored profiles and coverage generation
