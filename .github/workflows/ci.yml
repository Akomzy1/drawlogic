# TESTING.md layers 1–5. The gate for every PR to main.
# Layer 1: contract validation. Layers 2–4: the examiner-written tests (Codex writes trust/tests and engine/tests for
# Claude Code's modules; Claude Code writes fixtures/render and site/tests for Codex's) run here as they land.
# Layer 5: app/ checks run once app/ exists. Site fidelity (5a) runs in site-fidelity.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        run: npm ci

      - name: Every schema compiles, every example validates, rule-breaking mutations are rejected
        run: npm run validate

      - name: Generated TypeScript is current
        run: npm run check:generated

      - name: Provider interfaces typecheck against the generated types
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python generators
        run: pip install -r requirements.txt

      - name: Generated pydantic models are current
        run: python scripts/gen_py.py --check

      - name: pydantic models accept every example; Python condition text matches
        run: python scripts/check_py.py

  prototype:
    name: prototype files present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: design/prototype holds every file the fidelity skill lists
        run: node .github/scripts/prototype-files.mjs

  python:
    name: python lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install engine dev tools (pins from engine/pyproject.toml)
        run: |
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('engine/pyproject.toml','rb'))['project']['optional-dependencies']['dev']))")
          pip install -r contracts/requirements.txt

      - name: ruff
        run: |
          ruff check engine contracts trust profiles fixtures
          ruff format --check engine contracts/scripts trust fixtures profiles

      - name: mypy (strict)
        run: |
          mypy --strict contracts/scripts/condition_text.py contracts/scripts/gen_py.py contracts/scripts/check_py.py profiles/coverage.py profiles/tools.py
          if [ -n "$(find engine trust -name '*.py' -not -path '*/tests/*' | head -1)" ]; then
            mypy --strict --config-file engine/pyproject.toml engine trust
          else
            echo "::notice::No engine or trust source yet; mypy runs on them once code lands."
          fi

      # Codex's examiner suite for engine/core and trust (fixtures/core, trust/tests). Its pytest.ini marks tests
      # `fixtures` (offline, always green) or `runtime` (need the real implementation). Runtime tests run once the
      # module they gate exists, and are never skipped or mocked when it does.
      - name: examiner fixtures (core and trust)
        run: |
          if [ -f trust/tests/pytest.ini ]; then
            pip install -r trust/tests/requirements.txt
            python -m pytest -c trust/tests/pytest.ini -m fixtures
          else
            echo "::notice::No core/trust examiner suite yet (Codex, Prompt 2)."
          fi

      - name: profiles (Prompt 3) — derived fields current, examiner profile tests
        run: |
          python -m profiles.tools --check
          if [ -f trust/tests/pytest.ini ]; then
            python -m pytest -c trust/tests/pytest.ini -m "profiles and not runtime"
            # The profile runtime tests (-m profiles) need core interpretation; they join CI with Prompt 9.
          fi

      - name: examiner runtime — engine/core (Prompts 4, 6, 9)
        run: |
          if [ -f trust/tests/pytest.ini ] && [ -f engine/core/main.py ]; then
            pip install -e engine
            DRAWLOGIC_CORE_APP=engine.core.main:app python -m pytest -c trust/tests/pytest.ini -m runtime trust/tests/test_core_goldens.py trust/tests/test_core_properties.py
          else
            echo "::notice::engine/core/main.py not present yet; core runtime tests fail with CORE_UNAVAILABLE until Prompt 4."
          fi

      - name: examiner runtime — trust (Prompts 7, 11)
        run: |
          if [ -f trust/tests/pytest.ini ] && [ -f trust/main.py ]; then
            pip install -e engine
            python -m uvicorn trust.main:app --port 8765 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
            DRAWLOGIC_TRUST_URL=http://127.0.0.1:8765 python -m pytest -c trust/tests/pytest.ini -m runtime trust/tests/test_signing_gate.py trust/tests/test_audit_chain.py
          else
            echo "::notice::trust/main.py not present yet; trust runtime tests fail with TRUST_UNAVAILABLE until Prompt 7."
          fi

  render-fixtures:
    name: render fixtures (examiner, for engine/render)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install
        run: pip install -r fixtures/render/requirements.txt

      - name: Fixtures are current and valid against the contract
        run: |
          python fixtures/render/scripts/build.py --check
          python -m pytest fixtures/render/tests/test_fixtures.py

      - name: Render tests against the engine
        run: |
          if [ -f engine/app.py ]; then
            pip install -e engine
            python -m pytest fixtures/render/tests
          else
            echo "::notice::No engine/app.py yet (Prompt 5). The render tests exist and fail with 'engine render API not available' until it lands."
          fi

  app:
    name: app lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Is there an app yet?
        id: app
        run: |
          if [ -f app/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No app/ yet (Prompt 8)."; fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install, lint, typecheck, test
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test
